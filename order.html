<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Delivery Details | Dutchdown</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f5; color: #192e23; font: 16px/1.5 system-ui, sans-serif; }
    header { border-bottom: 1px solid #d9dfd8; padding: 10px 5vw; background: white; }
    a { color: inherit; }
    .brand { font-size: 24px; font-weight: 800; text-decoration: none; letter-spacing: -1px; }
    .checkout { max-width: 520px; margin: clamp(12px, 3vw, 32px) auto; padding: 0 16px 24px; }
    .back { display: inline-block; padding: 8px 0; }
    h1 { font-size: clamp(28px, 6vw, 38px); line-height: 1.4; margin: 10px 0; }
    #order-summary { overflow-wrap: anywhere; }
    form { background: white; border: 1px solid #d9dfd8; border-radius: 12px; padding: clamp(14px, 4vw, 24px); }
    label { display: block; font-weight: 650; margin-bottom: 4px; }
    input, textarea { display: block; width: 100%; padding: 10px; border: 1px solid #77847a; border-radius: 6px; font: inherit; margin-bottom: 14px; }
    textarea { resize: vertical; }
    #delivery-pin { margin-bottom: 4px; }
    .primary { display: block; width: 100%; margin-top: 16px; border: 0; padding: 12px; border-radius: 8px; background: #195636; color: white; font: inherit; font-weight: 650; cursor: pointer; }
  </style>
</head>
<body>
  <header><a class="brand" href="./">dutchdown</a></header>
  <main class="checkout">
    <a class="back" href="./#collection">Back to products</a>
    <h1 lang="gu">પૈસા ઓર્ડર મળે ત્યારે જ આપવાના છે</h1>
    <p id="order-summary" hidden></p>
    <noscript><p>Enable JavaScript to continue your WhatsApp order.</p></noscript>
    <form id="order-form" hidden>
      <label for="customer-name">Your Name / <span lang="gu">તમારું નામ</span></label>
      <input id="customer-name" placeholder="Full name / પૂરું નામ" autocomplete="name" maxlength="100" required>
      <label for="delivery-address">Address / <span lang="gu">સરનામું</span></label>
      <textarea id="delivery-address" autocomplete="street-address" rows="4" maxlength="500" placeholder="House no., street, area, city / ઘર નં., શેરી, વિસ્તાર, શહેર" required></textarea>
      <label for="delivery-pin">PIN Code / <span lang="gu">પિન કોડ</span></label>
      <input id="delivery-pin" type="text" inputmode="numeric" placeholder="6 digits / ૬ અંક" autocomplete="postal-code" pattern="[1-9][0-9]{5}" maxlength="6" aria-describedby="pin-help" required>
      <small id="pin-help">Required / ૬ અંકનો પિન કોડ ફરજિયાત છે.</small>
      <button class="primary" type="submit">Continue to WhatsApp / વોટ્સએપ ખોલો</button>
    </form>
  </main>
  <script>
    const form = document.querySelector("#order-form");
    const order = new URLSearchParams(location.search).get("text");
    const summary = document.querySelector("#order-summary");

    if (order) {
      summary.textContent = order.split("\n")[1] || "WhatsApp order";
      summary.hidden = false;
      form.hidden = false;
    } else {
      summary.textContent = "Choose a product to start your order.";
      summary.hidden = false;
    }

    const nameField = document.querySelector("#customer-name");
    const addressField = document.querySelector("#delivery-address");
    const pinField = document.querySelector("#delivery-pin");

    for (const field of [nameField, addressField]) {
      field.addEventListener("input", () => field.setCustomValidity(""));
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const name = nameField.value.trim();
      const address = addressField.value.trim();
      nameField.setCustomValidity(name ? "" : "Enter your name.");
      addressField.setCustomValidity(address ? "" : "Enter your delivery address.");
      if (!order || !form.reportValidity()) return;

      const whatsapp = new URL("https://wa.me/919016304096");
      whatsapp.searchParams.set("text", [
        order, "", "Name: " + name, "Address: " + address, "PIN Code: " + pinField.value
      ].join("\n"));
      location.assign(whatsapp.href);
    });
  </script>
</body>
</html>
